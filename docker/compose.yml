# Recorte — docker compose (spec §4). One container: API, worker, gallery, extension ZIPs and an embedded
# Meilisearch (127.0.0.1 inside the container only). No .env needed:
#   docker compose up -d            # published image; then open http://<IP>:8080/setup within 15 minutes
#   ../scripts/up.sh                # builds from this checkout with the Git versions (plain `docker compose up -d --build`
#                                   # would stamp 0.0.0)
# Everything lives in ./data (Linux: sudo chown 1000:1000 data). Optional settings: .env.example.
# HTTPS with a domain:           docker compose -f compose.yml -f compose.caddy.yml up -d
# External Meilisearch instead:  docker compose -f compose.yml -f compose.meili-external.yml up -d
name: recorte

services:
  app:
    image: ${RECORTE_IMAGE:-ghcr.io/qwickin/recorte:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        EXTENSION_VERSION: ${EXTENSION_VERSION:-0.0.0}
    restart: unless-stopped
    ports:
      - "${RECORTE_PORT:-8080}:8080"
    # All optional: each one, when set, overrides what the gallery saved in Definições → Servidor.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AI_CLOUD_URL: ${AI_CLOUD_URL:-}
      AI_CLOUD_KEY: ${AI_CLOUD_KEY:-}
      AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
    volumes:
      - ./data:/data
