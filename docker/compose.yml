# Recorte — docker compose stack (spec §4).
#   cp .env.example .env    # set MEILI_MASTER_KEY (and PUBLIC_URL)
#   mkdir -p data meili     # Linux: sudo chown 1000:1000 data
#   docker compose up -d    # pulls the published image; `--build` builds from this checkout
# HTTPS with a domain: docker compose -f compose.yml -f compose.caddy.yml up -d
name: recorte

services:
  app:
    image: ${RECORTE_IMAGE:-ghcr.io/qwickin/screenshotextension:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        EXTENSION_VERSION: ${EXTENSION_VERSION:-0.0.0}
    restart: unless-stopped
    ports:
      - "${RECORTE_PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (at least 16 characters)}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AI_CLOUD_URL: ${AI_CLOUD_URL:-}
      AI_CLOUD_KEY: ${AI_CLOUD_KEY:-}
      AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
    volumes:
      - ./data:/data
    depends_on:
      - search

  search:
    image: getmeili/meilisearch:v1.56.1
    restart: unless-stopped
    # No published port: only the app reaches it, on the compose network.
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (at least 16 characters)}
    volumes:
      - ./meili:/meili_data
