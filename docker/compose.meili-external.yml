# Advanced: Meilisearch as its own service instead of the one embedded in the app container.
#   MEILI_MASTER_KEY=… in .env (at least 16 characters; openssl rand -base64 32)
#   docker compose -f compose.yml -f compose.meili-external.yml up -d
# With MEILI_URL set the app does not start its embedded Meilisearch.
services:
  app:
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (at least 16 characters)}
    depends_on:
      search:
        condition: service_healthy

  search:
    image: getmeili/meilisearch:v1.56.1
    restart: unless-stopped
    # No published port: only the app reaches it, on the compose network.
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (at least 16 characters)}
    volumes:
      - ./meili:/meili_data
    healthcheck:
      # curl ships in the Meilisearch image (Alpine).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
