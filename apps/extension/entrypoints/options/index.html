<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recorte — Opções</title>
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <main class="options">
      <header>
        <h1>Recorte</h1>
        <p class="muted">Liga a extensão ao teu servidor. A password serve só para criar um token deste dispositivo e nunca fica guardada.</p>
      </header>

      <section class="card" id="connected" hidden>
        <div>
          <span class="label">Ligado</span>
          <p class="who"><span id="who-email"></span> <span class="muted">em</span> <span id="who-server"></span></p>
          <p class="error" id="auth-needed" hidden>O servidor recusou o token deste dispositivo. Volta a ligar a extensão — as capturas pendentes ficam na fila.</p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="reconnect" type="button">Voltar a ligar</button>
          <button class="btn ghost" id="disconnect" type="button">Desligar</button>
        </div>
      </section>

      <form class="card" id="login" autocomplete="on">
        <label class="field"><span class="label">Servidor</span>
          <input class="input" id="server" name="server" type="url" placeholder="https://recorte.exemplo.pt" required autocomplete="url" />
        </label>
        <label class="field"><span class="label">Email</span>
          <input class="input" id="email" name="email" type="email" required autocomplete="username" />
        </label>
        <label class="field"><span class="label">Password</span>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password" />
        </label>
        <label class="field"><span class="label">Nome deste dispositivo</span>
          <input class="input" id="device" name="device" type="text" maxlength="80" />
        </label>
        <p class="error" id="login-error" hidden></p>
        <div class="actions">
          <button class="btn ghost" id="cancel-login" type="button" hidden>Cancelar</button>
          <button class="btn primary" id="connect" type="submit">Ligar</button>
        </div>
      </form>

      <section class="card">
        <label class="toggle">
          <input type="checkbox" id="save-without-asking" />
          <span>
            <b>Guardar sem perguntar</b><br />
            <span class="muted">Envia logo a captura, sem o diálogo de título, nota, etiquetas e categoria.</span>
          </span>
        </label>
      </section>

      <section class="card">
        <span class="label">Atalhos</span>
        <ul class="shortcuts" id="shortcuts"></ul>
        <p class="muted small" id="shortcuts-hint"></p>
      </section>

      <p class="muted small" id="version"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
