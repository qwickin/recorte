name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PNPM_VERSION: 12.16.1

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.version.outputs.app }}
      extension: ${{ steps.version.outputs.extension }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history + tags: versions count commits since the last vX.Y tag

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }} && pnpm --version

      - name: Versions
        id: version
        run: |
          echo "app=$(node scripts/version.mjs --app)" >> "$GITHUB_OUTPUT"
          echo "extension=$(node scripts/version.mjs --extension)" >> "$GITHUB_OUTPUT"
          node scripts/version.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.extension }}
        run: |
          pnpm build
          pnpm --filter @recorte/extension zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extensions-${{ steps.version.outputs.extension }}
          path: |
            apps/extension/.output/recorte-chrome.zip
            apps/extension/.output/recorte-firefox.zip
          if-no-files-found: error

  image:
    name: Image (linux/amd64, linux/arm64) → GHCR
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.check.outputs.app }}
            EXTENSION_VERSION=${{ needs.check.outputs.extension }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.check.outputs.app }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
